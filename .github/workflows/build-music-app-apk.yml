name: Build Wave Music APK

# Builds the Flutter example app in example/music_streaming_app into a
# release APK. Runs on pushes to the app branch (and can be dispatched
# manually once this workflow lands on the default branch).
on:
  workflow_dispatch:
  push:
    branches:
      - arena/603a5ca0-youtube-explode-dart
    paths:
      - 'example/music_streaming_app/**'
      - '.github/workflows/build-music-app-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/music_streaming_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform around the app sources
        run: |
          set -e
          mkdir -p /tmp/app_backup
          cp -r lib /tmp/app_backup/lib
          cp -r test /tmp/app_backup/test
          cp pubspec.yaml analysis_options.yaml /tmp/app_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/app_backup/
          cp android/app/src/main/kotlin/com/example/music_streaming_app/MainActivity.kt /tmp/app_backup/
          flutter create --platforms=android --project-name music_streaming_app --org com.example .
          rm -rf lib test
          cp -r /tmp/app_backup/lib lib
          cp -r /tmp/app_backup/test test
          cp /tmp/app_backup/pubspec.yaml /tmp/app_backup/analysis_options.yaml .
          cp /tmp/app_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/music_streaming_app
          cp /tmp/app_backup/MainActivity.kt android/app/src/main/kotlin/com/example/music_streaming_app/MainActivity.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wave-music-release-apk
          path: example/music_streaming_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish APKs to the wave-music-v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view wave-music-v1.0.0 >/dev/null 2>&1 || \
            gh release create wave-music-v1.0.0 \
              --title "Wave Music v1.0.0 (Android APK)" \
              --notes "Release APKs for the Wave Music example app (example/music_streaming_app). Most phones need app-arm64-v8a-release.apk; use app-armeabi-v7a-release.apk for older 32-bit devices or app-x86_64-release.apk for emulators. Built by GitHub Actions from this repository."
          gh release upload wave-music-v1.0.0 build/app/outputs/flutter-apk/*.apk --clobber
